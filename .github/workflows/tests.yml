name: tests

on:
  push:
  pull_request:

jobs:
  # The spread of interpreters. emerge is stdlib-only by design, so the point
  # here is that it keeps working on whatever Python a target box happens to
  # ship -- an embedded Debian is not necessarily current.
  unit:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # dpkg-scanpackages (dpkg-dev) builds the test repository; diff3 and
      # dpkg back the differential tests; gpgv backs signature verification.
      - name: Install the Debian tooling the tests shell out to
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev diffutils gpgv gnupg

      - name: Byte-compile the shipped script
        run: python3 -m py_compile emerge

      - name: Unit tests
        run: python3 -m unittest test_emerge -v

      - name: Integration tests
        run: python3 -m unittest test_integration -v

      # The two steps above are separate processes, deliberately, so a
      # failure says which half broke. That also means neither can catch a
      # test that patches a shared module object -- os, shutil, subprocess
      # are the same objects the script imports -- and fails to restore it:
      # the damage lands only in whatever runs next. One did, and both
      # halves passed on their own while the pair failed.
      - name: Tests must not leak state between modules
        run: python3 -m unittest test_emerge test_integration

      # These pass locally by accident of CPython refcounting if a handle is
      # left open; make that a failure rather than a warning.
      - name: Tests must not leak file handles
        run: python3 -W error::ResourceWarning -m unittest test_emerge test_integration

  # The actual target platform. Ubuntu runners are close, but the version
  # quirks this project exists for (+debNuN, binNMU) are Debian's.
  debian:
    name: debian trixie
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            python3 dpkg-dev build-essential diffutils gpgv gnupg \
            ca-certificates

      - name: Byte-compile the shipped script
        run: python3 -m py_compile emerge

      # kept as separate steps so a failure says which half broke without
      # needing the logs
      - name: Unit tests
        run: python3 -m unittest test_emerge -v

      # Strict here and only here. Every integration class skips itself when
      # the tool it drives is missing, which is what lets the suite run off
      # a Debian box -- and is also how a whole capability goes untested
      # while the run still reports OK. This job is the one that is meant to
      # cover everything, so a skip is a failure naming what is absent.
      # It found a real gap: CI installed gpgv but not gpg, so the entire
      # signature-verification suite had never run here.
      - name: Integration tests
        run: python3 -m unittest test_integration -v
        env:
          EMERGE_TESTS_REQUIRE_ALL: "1"

      - name: Tests must not leak state between modules
        run: python3 -m unittest test_emerge test_integration

      # Every other step here pipes stdout, and the script decides whether
      # to colour its output from sys.stdout.isatty() once, at import. So a
      # test asserting on output can pass in all of them and fail for the
      # person who typed the command -- which happened, and took `make deb`
      # with it. This is the only step that runs under a terminal.
      - name: Tests must not depend on a terminal
        run: make check-tty

  # The package has to build, install, and produce a working emerge. Building
  # it proves very little on its own -- a .deb full of the wrong paths builds
  # perfectly -- so this installs the result and runs it.
  package:
    name: debian package
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install the build tooling
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential debhelper lintian python3 \
            dpkg-dev diffutils gpgv gnupg ca-certificates man-db groff-base

      - name: Build the package
        run: make deb

      - name: Install it, resolving dependencies as a user would
        run: |
          apt-get install -y ./dist/apt-emerge_*_all.deb

      # The point of the job. A package that installs but ships a broken
      # entry point is not a working install.
      - name: The installed emerge runs
        run: |
          set -e
          command -v emerge
          emerge --version
          emerge --help > /dev/null
          emerge -pv bash

      - name: argv[0] dispatch works through the packaged symlinks
        run: |
          set -e
          test -L /usr/bin/dispatch-conf
          test -L /usr/bin/etc-update
          # not root-gated under --help, and must not be the merge path
          dispatch-conf --help | grep -q 'dispatch-conf'

      - name: The man pages are installed and render
        run: |
          set -e
          man -w emerge
          man emerge | head -5
          man -w dispatch-conf
          man -w etc-update

      # This ran with `|| true` for as long as nobody had read its output.
      # It has been read now: the binary package is clean, and the one tag
      # it does emit -- uses-dpkg-database-directly -- is the one the
      # override in debian/ answers. So a tag here is a regression, and the
      # step fails on it rather than scrolling past.
      - name: Lintian, on the binary package
        run: lintian --tag-display-limit 0 --fail-on error,warning dist/*.changes

      # The source package is built separately because `make deb` builds
      # --build=binary: its .changes names a .deb and a .buildinfo and no
      # .dsc, so every source-only check silently had nothing to look at.
      # Running them found two things at once, one of them a real defect --
      # an override_dh_auto_test that ignored DEB_BUILD_OPTIONS=nocheck.
      #
      # Info-level tags do not fail the build here: out-of-date-standards-
      # version fires the moment Policy is released, which is news rather
      # than a defect in this package, and is not worth a red run.
      - name: Lintian, on the source package
        run: |
          set -e
          dpkg-buildpackage --build=source --no-sign
          lintian --tag-display-limit 0 --fail-on error,warning \
                  -I --pedantic ../apt-emerge_*.dsc

      - name: Removing it leaves nothing behind
        run: |
          set -e
          apt-get remove -y apt-emerge
          test ! -e /usr/bin/emerge
          test ! -e /usr/bin/dispatch-conf

  # Indentation and whitespace. The rules are in code-style.md and the gate
  # is tools/style_gate.py, shared verbatim with the sibling projects.
  #
  # The interpreter is pinned rather than left to the runner because the
  # gate reads .style-gate.toml with tomllib, which is 3.11+. It refuses to
  # run without it rather than checking a smaller set of files and calling
  # that success, so an unpinned runner that went backwards would fail the
  # job honestly -- but failing over the runner's Python version is not what
  # this job is for, and pinning means it never comes up.
  style:
    name: style gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Indentation, whitespace and line endings
        run: make style PYTHON=python3

  # Hard rule 1: the shipped artifact is a single stdlib-only file. That is
  # the whole deploy story for apt-less boxes, and it is easy to break by
  # reaching for a convenient dependency.
  stdlib-only:
    name: stdlib-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The shipped script must import nothing outside the stdlib
        run: |
          python3 - <<'EOF'
          import ast, sys
          mods = set()
          for node in ast.walk(ast.parse(open("emerge").read())):
              if isinstance(node, ast.Import):
                  mods.update(a.name.split(".")[0] for a in node.names)
              elif (isinstance(node, ast.ImportFrom)
                    and node.level == 0 and node.module):
                  mods.add(node.module.split(".")[0])
          extra = sorted(mods - set(sys.stdlib_module_names))
          print("imports:", ", ".join(sorted(mods)))
          if extra:
              sys.exit(f"non-stdlib imports in the shipped script: {extra}")
          EOF

      - name: The shipped artifact must stay a single file
        run: |
          test -f emerge || { echo "emerge is missing"; exit 1; }
          stray=$(ls *.py 2>/dev/null | grep -v '^test_' || true)
          if [ -n "$stray" ]; then
            echo "non-test .py files alongside emerge -- did the shipped" \
                 "artifact stop being one file?"
            echo "$stray"
            exit 1
          fi
