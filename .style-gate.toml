# Configuration for tools/style_gate.py -- see code-style.md.
#
# Nothing here changes the rules. It says which files in *this* tree they
# apply to, and it is deliberately short: most of what this file used to say
# has since been fixed in the tool itself, which is the better place for it.

# Only `Makefile` needs naming now, and it is the one name that cannot be
# derived. `emerge` and `debian/rules` were listed here too, because the gate
# selected files by suffix and both lack one -- it now recognises an
# extensionless file that begins with `#!` as a program, which is exactly
# what they are. That was this project's finding and it went upstream.
#
# A Makefile has neither a suffix nor a shebang, so without this line it is
# not checked at all -- not merely exempted from the tab rule, but dropped
# from the trailing-whitespace and final-newline checks with it. Naming it
# does apply the tab rule, which the shipped default deliberately does not,
# on the grounds that the body of an `ifeq` must be space-indented (a tab
# there reads as a recipe line). This Makefile has no `ifeq`, so the rule
# costs nothing today and buys the text checks. Add one and the right answer
# changes: raise it rather than deleting the line to make the gate quiet.
indent_names = ["Makefile"]

# Below this the gate fails instead of passing, because "found nothing" in a
# tree with sources means the file list collapsed, not that the tree came
# back clean. Eleven files match today; eight is under the real count
# deliberately, so adding a document does not require touching this.
floor = 8

# `exclude` used to be set here, naming dist, .pytest_cache and .claude on
# top of the defaults -- because the git and plain-walk discovery paths
# disagreed about them. Those three are in the shipped defaults now, so
# restating them would only be a copy to drift out of step.
